name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  daml-ci:
    name: Daml Build, Test & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DPM
        run: curl https://get.digitalasset.com/install/install.sh | sh

      - name: Add DPM to PATH
        run: echo "$HOME/.dpm/bin" >> $GITHUB_PATH

      - name: Verify DPM installation
        run: dpm --version

      - name: Build Daml model
        run: dpm build

      - name: Run Daml unit tests
        run: dpm test

      - name: Run Paying Agent Simulation
        # This script runs a more extensive, end-to-end test simulating
        # the paying agent's role over the bond lifecycle.
        run: dpm test --files daml/Test/PayingAgentSimulation.daml

  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run tests
        # The --watchAll=false flag is important for running in a non-interactive CI environment
        run: npm test -- --watchAll=false