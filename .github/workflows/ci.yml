name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test Daml Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DPM
        run: curl https://get.digitalasset.com/install/install.sh | sh

      - name: Add DPM to PATH
        run: echo "$HOME/.dpm/bin" >> $GITHUB_PATH

      - name: Verify DPM installation
        run: dpm --version

      - name: Cache DPM package dependencies
        uses: actions/cache@v4
        with:
          path: ~/.dpm/packages
          key: ${{ runner.os }}-dpm-${{ hashFiles('**/daml.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dpm-

      - name: Build Daml project
        run: dpm build

      - name: Run all Daml Script tests
        # This command discovers and runs all test scripts in the `daml/test` directory.
        # It is expected to include unit tests for individual templates as well as
        # end-to-end lifecycle simulations, such as the paying agent disbursing coupons.
        run: dpm test